networks:
  justontime-network:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - INVITE_BASE_URL=${INVITE_BASE_URL}
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - justontime-network

  pg:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
      PGPORT: ${DB_PORT}
    expose:
      - ${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./_data/pg/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - justontime-network